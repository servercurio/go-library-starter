# SPDX-License-Identifier: Apache-2.0

name: "800: [CALL] Semantic Release"
on:
  workflow_call:
    inputs:
      dry-run:
        description: "Run semantic-release in dry-run mode"
        type: boolean
        required: false
        default: false
      node-version:
        description: "Node.js Version:"
        type: string
        required: false
        default: "22"
      go-version:
        description: "Go Version:"
        type: string
        required: false
        default: "1.26.5"
      task-version:
        description: "Task Version:"
        type: string
        required: false
        default: "3.39.2"
    outputs:
      version:
        description: "Version produced by semantic-release (empty if no release)"
        value: ${{ jobs.release.outputs.version }}
      released:
        description: "true if semantic-release produced a new version"
        value: ${{ jobs.release.outputs.released }}
    secrets:
      release-token:
        description: "GitHub token used for tagging, committing the version bump, and publishing the release. Use the default GITHUB_TOKEN for unprotected branches; use a PAT (e.g. GH_ACCESS_TOKEN) when branch protection requires bypass."
        required: true
      gpg-private-key:
        description: "ASCII-armored GPG private key used to sign the release commit and the SBOM artefacts"
        required: true
      gpg-passphrase:
        description: "Passphrase for the GPG private key"
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  release:
    name: "Semantic Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write       # OIDC token for actions/attest-* (Sigstore Fulcio keyless signing)
      attestations: write   # GitHub attestation API — write provenance/sbom predicates
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
      released: ${{ steps.semantic-release.outputs.released }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.release-token }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ inputs.task-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GoLang
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: false

      - name: Import GPG Key
        id: import-gpg
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828 # v7.0.0
        with:
          gpg_private_key: ${{ secrets.gpg-private-key }}
          passphrase: ${{ secrets.gpg-passphrase }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false

      - name: Install DCO Sign-off Hook
        run: |
          cat > .git/hooks/prepare-commit-msg <<'HOOK'
          #!/bin/sh
          # Auto-append DCO Signed-off-by line if not already present.
          msg="$1"
          if ! grep -q "^Signed-off-by:" "$msg"; then
            name="${GIT_AUTHOR_NAME:-$(git config user.name)}"
            email="${GIT_AUTHOR_EMAIL:-$(git config user.email)}"
            printf "\nSigned-off-by: %s <%s>\n" "$name" "$email" >> "$msg"
          fi
          HOOK
          chmod +x .git/hooks/prepare-commit-msg

      - name: Install Semantic Release
        # --ignore-scripts disables npm package lifecycle scripts
        # (preinstall/install/postinstall) for both direct and transitive
        # deps. Historically the main RCE vector when a transitive package
        # gets compromised; semantic-release and its plugins don't need
        # install scripts to function.
        run: |
          npm install -g --ignore-scripts \
            semantic-release@24.2.4 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.0.3 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@10.0.1 \
            @semantic-release/github@11.0.1 \
            conventional-changelog-conventionalcommits@8.0.0

      - name: Run Semantic Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.release-token }}
          GIT_AUTHOR_NAME: ${{ steps.import-gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.import-gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.import-gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.import-gpg.outputs.email }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            FLAGS="--dry-run"
          fi
          npx semantic-release ${FLAGS}
          if [[ -s .release-version ]]; then
            VERSION="$(cat .release-version | tr -d '[:space:]')"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            echo "released=true" >> "${GITHUB_OUTPUT}"
            echo "Semantic release produced version: ${VERSION}"
          else
            echo "version=" >> "${GITHUB_OUTPUT}"
            echo "released=false" >> "${GITHUB_OUTPUT}"
            echo "Semantic release did not produce a new version."
          fi

      # ------------------------------------------------------------------
      # GitHub-signed Sigstore attestations. The source SBOM (CycloneDX
      # JSON and XML) gets a provenance attestation and an attest-sbom
      # binding so consumers can verify the dependency manifest both via
      # `gh attestation verify` and via the GitHub attestation log.
      # ------------------------------------------------------------------

      - name: Attest provenance for SBOM artefacts
        if: ${{ inputs.dry-run == false && steps.semantic-release.outputs.released == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom.json
            sbom.xml
            sbom.json.asc
            sbom.xml.asc

      - name: Attest CycloneDX JSON SBOM
        if: ${{ inputs.dry-run == false && steps.semantic-release.outputs.released == 'true' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: sbom.json
          sbom-path: sbom.json

      - name: Attest CycloneDX XML SBOM
        if: ${{ inputs.dry-run == false && steps.semantic-release.outputs.released == 'true' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: sbom.xml
          sbom-path: sbom.xml
