# SPDX-License-Identifier: Apache-2.0

version: 3
output: prefixed

env:
  CGO_ENABLED: 0
  APP_LOG_LEVEL: trace
  APP_LOG_INCLUDE_CALLER: false

vars:
  # license-eye (github.com/apache/skywalking-eyes) version for lint:license and
  # license:fix; the only place it is pinned. CI runs `task lint:license`.
  LICENSE_EYE_VERSION: v0.9.0

tasks:
  default:
    desc: "Tidy modules, lint, and run the test suite"
    cmds:
      - task: vendor
      - task: lint
      - task: test

  clean:
    desc: "Remove all generated files"
    cmds:
      - task: clean:test
      - task: clean:sbom
      - task: clean:version

  clean:test:
    desc: "Remove coverage output"
    internal: true
    cmds:
      - rm -vf cover.out

  clean:sbom:
    desc: "Remove SBOM artefacts emitted by the sbom task"
    internal: true
    cmds:
      - rm -vf sbom.json sbom.json.asc sbom.xml sbom.xml.asc

  clean:version:
    desc: "Remove generated version metadata"
    internal: true
    cmds:
      - rm -vf pkg/version/commit.txt

  clean:cache:
    desc: "Remove all Go build caches"
    cmds:
      - go clean -cache -testcache

  lint:
    desc: "Run linters on all Go files and check SPDX license headers"
    cmds:
      - task: lint:format
      - task: lint:vet
      - task: lint:golangci
      - task: lint:license

  lint:format:
    internal: true
    desc: "Run go fmt on all Go files"
    cmds:
      - go fmt ./...

  lint:vet:
    internal: true
    desc: "Run go vet on all Go files"
    cmds:
      - go vet -atomic -defers -assign -bools -buildtag -framepointer -lostcancel -loopclosure -nilfunc -shift -stdmethods -stringintconv -structtag ./...

  lint:golangci:
    internal: true
    desc: "Run golangci-lint with the project's .golangci.yml"
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - "$(go env GOPATH)/bin/golangci-lint run --timeout=5m ./..."

  lint:license:
    desc: "Check SPDX license headers and Helm template header style (CI runs this task)"
    cmds:
      - task: tool:license-eye
      - "$(go env GOPATH)/bin/license-eye -c .licenserc.yaml header check"
      - cmd: |
          lb='{'
          want="$lb$lb- /* SPDX-License-Identifier: Apache-2.0 */ -}}"
          bad=$(find charts -path '*/templates/*' -type f ! -exec sh -c 'head -n 1 "$1" | grep -qF -- "$2"' _ {} "$want" \; -print 2>/dev/null || true)
          if [ -n "$bad" ]; then echo "Helm templates must start with $want:"; echo "$bad"; exit 1; fi

  license:fix:
    desc: "Add missing SPDX license headers (Helm templates need a manual Go-template comment)"
    cmds:
      - task: tool:license-eye
      - "$(go env GOPATH)/bin/license-eye -c .licenserc.yaml header fix"

  tool:license-eye:
    internal: true
    desc: "Install license-eye {{.LICENSE_EYE_VERSION}}"
    cmds:
      - go install github.com/apache/skywalking-eyes/cmd/license-eye@{{.LICENSE_EYE_VERSION}}

  vendor:
    desc: "Update Go modules and vendor directory"
    cmds:
      - cmd: echo "Tidying up Go modules"
        silent: true
      - cmd: go mod tidy
        silent: true
      - cmd: echo "Updating vendor directory"
        silent: true
      - cmd: go mod vendor
        silent: true

  generate:
    desc: "Run all go:generate directives (version metadata, etc.)"
    cmds:
      - cmd: go generate ./...
        silent: true

  build:
    desc: "Compile every package in the module (no binary output — verifies the library tree builds end-to-end)"
    deps:
      - generate
    cmds:
      - cmd: go build ./...
        silent: true

  test:
    desc: "Run all tests"
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -parallel 4 -cover -coverprofile cover.out -race -v ./...

  sbom:
    desc: "Generate CycloneDX SBOMs (sbom.json + sbom.xml) for the Go module and GPG-sign each output"
    deps:
      - vendor
    cmds:
      - cmd: |
          set -e
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -json=true -licenses -output sbom.json
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -licenses -output sbom.xml
          # SBOMs are themselves manifests; sign them directly so consumers can verify the
          # dependency listing offline. Signing is best-effort locally — the workflow
          # imports a GPG key before running this task.
          if gpg --list-secret-keys --with-colons 2>/dev/null | grep -q '^sec'; then
            gpg --batch --yes --detach-sign --armor --output sbom.json.asc sbom.json
            gpg --batch --yes --detach-sign --armor --output sbom.xml.asc sbom.xml
          else
            echo "warning: no GPG signing key configured; skipping SBOM signature" >&2
          fi
        silent: true
